<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - FoodExpress</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="preloader">
  <div class="loader"></div>
</div>

<div id="toastBox"></div>

<button id="themeToggle" class="theme-toggle">
  <i class="fa-solid fa-moon"></i>
</button>

<button id="backToTop" class="back-top-btn">
  <i class="fa-solid fa-arrow-up"></i>
</button>

<nav class="navbar navbar-expand-lg fixed-top premium-navbar">
  <div class="container">
    <a class="navbar-brand brand-logo" href="index.html">
      <div class="logo-box"><i class="fa-solid fa-burger"></i></div>
      <span>FoodExpress</span>
    </a>

    <button class="navbar-toggler menu-btn" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <i class="fa-solid fa-bars"></i>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="foodmenu.html">Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="restaurant.html">Restaurants</a></li>
        <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
        <li class="nav-item"><a class="nav-link active" href="checkout.html">Checkout</a></li>
      </ul>

      <a href="cart.html" class="nav-icon cart-icon">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="food-cart-count">0</span>
      </a>
    </div>
  </div>
</nav>

<section class="page-hero">
  <div class="container text-center">
    <span class="section-badge">Secure Checkout</span>
    <h1>Complete Your Order</h1>
    <p>Enter your delivery details and confirm your food order.</p>
  </div>
</section>

<section class="food-cart-section py-5">
  <div class="container">
    <div class="row g-4">

      <div class="col-lg-7">
        <div class="food-cart-box">
          <h3 class="mb-4">Delivery Details</h3>

          <form id="checkoutForm">
            <div class="row">
              <div class="col-md-6 mb-4">
                <input type="text" class="form-control neon-input" placeholder="Full Name" required>
              </div>

              <div class="col-md-6 mb-4">
                <input type="text" class="form-control neon-input" placeholder="Phone Number" required>
              </div>
            </div>

            <div class="mb-4">
              <input type="email" class="form-control neon-input" placeholder="Email Address" required>
            </div>

            <div class="mb-4">
              <textarea rows="4" class="form-control neon-input" placeholder="Full Delivery Address" required></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-4">
                <select class="form-control neon-input" required>
                  <option value="">Payment Method</option>
                  <option>Cash On Delivery</option>
                  <option>UPI Payment</option>
                  <option>Debit / Credit Card</option>
                </select>
              </div>

              <div class="col-md-6 mb-4">
                <input type="text" class="form-control neon-input" placeholder="Coupon Code Optional">
              </div>
            </div>

            <button type="submit" class="food-checkout-btn">
              Place Order
            </button>
          </form>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="food-cart-summary">
          <h3>Order Summary</h3>

          <div id="checkoutItems" class="mt-4"></div>

          <hr>

          <div class="summary-row">
            <span>Total Items</span>
            <strong id="checkoutTotalItems">0</strong>
          </div>

          <div class="summary-row">
            <span>Subtotal</span>
            <strong id="checkoutSubtotal">₹0</strong>
          </div>

          <div class="summary-row">
            <span>Delivery</span>
            <strong>₹49</strong>
          </div>

          <hr>

          <div class="summary-row total">
            <span>Total</span>
            <strong id="checkoutGrandTotal">₹0</strong>
          </div>

          <a href="cart.html" class="food-clear-btn mt-3">Back To Cart</a>
        </div>
      </div>

    </div>
  </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const cart = JSON.parse(localStorage.getItem("foodCart")) || [];

  const checkoutItems = document.getElementById("checkoutItems");
  const totalItems = document.getElementById("checkoutTotalItems");
  const subtotal = document.getElementById("checkoutSubtotal");
  const grandTotal = document.getElementById("checkoutGrandTotal");
  const cartCount = document.querySelector(".food-cart-count");
  const checkoutForm = document.getElementById("checkoutForm");

  setTimeout(() => {
    const preloader = document.getElementById("preloader");
    if (preloader) preloader.style.display = "none";
  }, 700);

  function showToast(message) {
    const toastBox = document.getElementById("toastBox");
    if (!toastBox) return;

    const toast = document.createElement("div");
    toast.className = "custom-toast";
    toast.innerText = message;
    toastBox.appendChild(toast);

    setTimeout(() => toast.remove(), 2500);
  }

  function renderCheckout() {
    checkoutItems.innerHTML = "";

    if (cart.length === 0) {
      checkoutItems.innerHTML = `
        <div class="empty-cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <h4>Your cart is empty</h4>
          <p>Add food items before checkout.</p>
          <a href="foodmenu.html" class="btn btn-warning rounded-pill px-4">Order Now</a>
        </div>
      `;

      totalItems.innerText = "0";
      subtotal.innerText = "₹0";
      grandTotal.innerText = "₹0";
      if (cartCount) cartCount.innerText = "0";
      return;
    }

    let total = 0;
    let count = 0;

    cart.forEach((item) => {
      const priceNumber = Number(item.price.replace(/[₹,]/g, ""));
      total += priceNumber * item.qty;
      count += item.qty;

      checkoutItems.innerHTML += `
        <div class="cart-item">
          <img src="${item.image}" alt="${item.name}">
          <div>
            <h5>${item.name}</h5>
            <p>${item.price} × ${item.qty}</p>
          </div>
        </div>
      `;
    });

    totalItems.innerText = count;
    subtotal.innerText = `₹${total}`;
    grandTotal.innerText = `₹${total + 49}`;
    if (cartCount) cartCount.innerText = count;
  }

  checkoutForm.addEventListener("submit", function (e) {
    e.preventDefault();

    if (cart.length === 0) {
      showToast("Cart is empty");
      return;
    }

    showToast("Order Placed Successfully!");

    setTimeout(() => {
      localStorage.removeItem("foodCart");
      window.location.href = "foodmenu.html";
    }, 1500);
  });

  renderCheckout();
});
</script>

<script src="js/auth.js"></script>

</body>
</html>
